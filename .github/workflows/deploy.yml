name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-proxy:
    runs-on: ubuntu-latest
    outputs:
      proxy_url: ${{ steps.proxy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy Cloudflare Worker proxy
        id: proxy
        working-directory: proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets no configurados — saltando deploy del proxy"
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm install
          OUTPUT=$(npx wrangler deploy 2>&1 | tee /tmp/wrangler.log)
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/wrangler.log | head -1)
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Proxy desplegado: ${URL}"

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: deploy-proxy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve API URL for GitHub Pages
        id: api
        run: |
          PROXY="${{ needs.deploy-proxy.outputs.proxy_url }}"
          FALLBACK="${{ vars.TASKFLOW_PROXY_URL }}"
          if [ -n "$PROXY" ]; then
            echo "url=$PROXY" >> "$GITHUB_OUTPUT"
          elif [ -n "$FALLBACK" ]; then
            echo "url=$FALLBACK" >> "$GITHUB_OUTPUT"
          else
            echo "url=http://52.87.135.237:8080" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin proxy HTTPS — login en GitHub Pages no funcionará hasta configurar Cloudflare. Ver proxy/README.md"
          fi

      - name: Install demos
        run: npm run install:demos

      - name: Build site
        env:
          VITE_API_URL: ${{ steps.api.outputs.url }}
        run: npm run build:site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

      - id: deployment
        uses: actions/deploy-pages@v4
