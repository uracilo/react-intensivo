name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install demos
        run: npm run install:demos

      - name: Build site
        env:
          # Set repo variable TASKFLOW_PROXY_URL (HTTPS proxy) for login on GitHub Pages
          VITE_API_URL: ${{ vars.TASKFLOW_PROXY_URL }}
        run: npm run build:site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

      - id: deployment
        uses: actions/deploy-pages@v4
