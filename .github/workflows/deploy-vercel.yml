name: Deploy Vercel

on:
  workflow_dispatch:

jobs:
  deploy-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy API proxy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"
        working-directory: proxy

  deploy-demo-05:
    runs-on: ubuntu-latest
    needs: deploy-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & build demo 05
        run: npm install && npm run build
        working-directory: demos/05-taskflow
      - name: Deploy demo 05
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"
        working-directory: demos/05-taskflow
